name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Validate Keystore Secret
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing or empty. Please add it to your repository secrets."
          exit 1

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'my-release-key.jks'
          encodedString: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          # Convert file path to be accessible by Gradle
          # We pass the store path, password, alias, and key password as env vars
          # You might need to adjust android/app/build.gradle to read these or use a signing config
          # For a standard React Native / Expo prebuild, it's often easier to specificy these in gradle.properties or command line
          # Here we just run assembleRelease. Without signing config updates in build.gradle, this might produce unsigned or debug signed unless configured.
          # To keep it simple for now, we will inject the signing config dynamically or expect the user to have configured app.json correctly if possible,
          # BUT standard expo prebuild doesn't auto-configure signing for gradle unless using EAS.
          # So we will let it build the unsigned/debug release or standard release.
          # Wait, standard `./gradlew assembleRelease` will fail or produce unsigned if no signing config is present.
          # Let's try to inject the signing properties via command line params which is safer.
          ORG_GRADLE_PROJECT_androidStoreFile: ${{ steps.decode_keystore.outputs.filePath }}
          ORG_GRADLE_PROJECT_androidStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_androidKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_androidKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
