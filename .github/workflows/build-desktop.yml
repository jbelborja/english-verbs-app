name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Construir para Windows'
        required: true
        type: boolean
        default: true
      build_macos:
        description: 'Construir para macOS'
        required: true
        type: boolean
        default: true
      build_linux:
        description: 'Construir para Linux'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: Windows
            id: windows
            enabled: ${{ github.event.inputs.build_windows == 'true' }}
          - platform: macos-latest
            os: macOS
            id: macos
            enabled: ${{ github.event.inputs.build_macos == 'true' }}
          - platform: ubuntu-22.04
            os: Linux
            id: linux
            enabled: ${{ github.event.inputs.build_linux == 'true' }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        if: ${{ matrix.enabled }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.enabled }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ matrix.enabled }}
        run: npm ci

      - name: Install Rust
        if: ${{ matrix.enabled }}
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.id == 'linux' && matrix.enabled
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Build Desktop App
        if: ${{ matrix.enabled }}
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ""
        with:
          args: --verbose
          includeRelease: false

      - name: Upload Artifacts
        if: ${{ matrix.enabled }}
        uses: actions/upload-artifact@v4
        with:
          name: english-verbs-${{ matrix.id }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.appimage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
